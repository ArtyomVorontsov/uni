version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skytracker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: skytracker
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skytracker_backend
    ports:
      - "3002:3001"
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_DATABASE: skytracker
      OPENSKY_CLIENT_ID: artjomsvoroncovs-api-client
      OPENSKY_CLIENT_SECRET: fpPvVAA8No5FnfVpFc5BuBZmcrTG0w0b
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skytracker_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
